services:

  eureka:
    build:
      context: ./gym-system-eureka
    container_name: eureka
    ports:
      - "8761:8761"


  main-app:
    build:
      context: ./gym-crm-system-Spring-Main-App
    container_name: gym-main
    ports:
      - "8080:8080"
    depends_on:
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker


  workload-service:
    build:
      context: ./gym-system-workload
    container_name: gym-workload
    ports:
      - "8081:8081"
    depends_on:
      - eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
